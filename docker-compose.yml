# Sobe tudo no mini-PC da loja:  docker compose up -d --build
services:
  banco:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: distribuidora
      POSTGRES_USER: distribuidora
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
      TZ: America/Sao_Paulo
    volumes:
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distribuidora"]
      interval: 10s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      banco: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://distribuidora:${DB_SENHA}@banco:5432/distribuidora
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      CRON_SECRET: ${CRON_SECRET:?defina CRON_SECRET no .env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      WEBHOOK_ALERTAS: ${WEBHOOK_ALERTAS:-}
      FAIXAS_VALIDADE: ${FAIXAS_VALIDADE:-15,30,60,90}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-}

  # HTTPS na rede local (necessário para a câmera do celular funcionar)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      ENDERECO_LOJA: ${ENDERECO_LOJA:-estoque.local}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data

  # Backup diário + alertas de validade (cron)
  rotinas:
    build: ./infra/rotinas
    restart: unless-stopped
    depends_on:
      banco: { condition: service_healthy }
    environment:
      PGHOST: banco
      PGUSER: distribuidora
      PGPASSWORD: ${DB_SENHA}
      PGDATABASE: distribuidora
      CRON_SECRET: ${CRON_SECRET}
      BACKUP_SENHA: ${BACKUP_SENHA:?defina BACKUP_SENHA no .env}
      RCLONE_DESTINO: ${RCLONE_DESTINO:-}
      WEBHOOK_ALERTAS: ${WEBHOOK_ALERTAS:-}
      TZ: America/Sao_Paulo
    volumes:
      - ${PASTA_BACKUP:-./backups}:/backups
      - ./infra/rclone:/config/rclone

volumes:
  dados_banco:
  caddy_dados:
